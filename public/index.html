<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="Assets/dot.svg">
    <title>BlinkCamp - Free Online Eye Muscles And Vision Training Exercises</title>
    <meta name="description" content="BlinkCamp Is A Free Online Software That Helps Individuals Acheive Great Results For Eye Treatment And Visual Improvement. Try It Out Now!">
    <html lang='en'>
    <meta name="keywords" content="eye training exercises,online eye exercises, vision exercises,eye strain exercises,
    online eye trainer, BlinkCamp, lazy eye exercises">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-HS9SH7F8BT"></script>
    <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-HS9SH7F8BT');
    </script>
</head>
<body>
    <!-- <div id="videoplayercontainer">
        <div id="videoplayer"></div>
    </div> -->
    <div class="game">
        <div class="dot" id="dot"></div>
    </div>
    <div class="ui">
        <div class="rangerow">
            <div class="label">Range</div>
            <input id="rangeslider" type="range" min="20" max="100" value="100" step="1" title="How much of the screen the dot travels across" aria-label="Movement range">
            <div id="rangevalue">100%</div>
        </div>
        <div class="arrow left"></div>
        <div class="arrow right"></div>
        <div id="velocitytext">Speed</div>
        <input id="velocityslider" type="range" min="0.25" max="25" value="3" step="0.001">
        <div id="sizetext">Size</div>
        <input id="sizeslider" type="range" min="0.01" max="10" value="2" step="0.001">
        <div class="changeroutine">Change Routine</div>
        <div class="routinename">Routine Name</div>
        <div class="lookrow" role="group" aria-label="Appearance">
            <div class="label">Theme</div>
            <div class="themeswatches">
                <button class="themeswatch" data-theme="classic" title="Classic" aria-label="Classic theme" style="--swatch-bg:#1e1e1e;--swatch-dot:#e2b714"></button>
                <button class="themeswatch" data-theme="midnight" title="Midnight" aria-label="Midnight theme" style="--swatch-bg:#0e1726;--swatch-dot:#4fd1c5"></button>
                <button class="themeswatch" data-theme="forest" title="Forest" aria-label="Forest theme" style="--swatch-bg:#142019;--swatch-dot:#f4a259"></button>
                <button class="themeswatch" data-theme="paper" title="Paper (light)" aria-label="Paper theme" style="--swatch-bg:#f1ede4;--swatch-dot:#c2412d"></button>
                <button class="themeswatch" data-theme="contrast" title="High contrast" aria-label="High contrast theme" style="--swatch-bg:#000000;--swatch-dot:#ffffff"></button>
            </div>
            <div class="sublabel">Dot</div>
            <input id="dotcolor" type="color" value="#e2b714" title="Dot color" aria-label="Dot color">
            <div class="shapebuttons">
                <button class="shapebutton" data-shape="circle" title="Circle" aria-label="Circle dot"></button>
                <button class="shapebutton" data-shape="square" title="Square" aria-label="Square dot"></button>
                <button class="shapebutton" data-shape="diamond" title="Diamond" aria-label="Diamond dot"></button>
                <button class="shapebutton" data-shape="ring" title="Ring" aria-label="Ring dot"></button>
            </div>
        </div>
        <!-- <div class="backgroundvideo">Background Video</div> -->
        <!-- <input type="checkbox" class="backgroundvideotick" checked></div> -->
        <!-- <div class="notifications">Set Daily Reminders</div>
        <button class="notifications" id="notifications-button"></button> -->
        <a href="https://discord.gg/Fea2vU8JFC" target="_blank">
            <img src="Assets/discord-icon.svg" class="socialicon" id="discord-icon" alt="Blinkcamp discord icon">
        </a>
        <a href="https://github.com/ErezShahaf/BlinkCamp" target="_blank">
            <img src="Assets/github-icon.svg" class="socialicon" id="github-icon" alt="Blinkcamp github repository icon">
        </a>
    </div>
</body>
<script src="https://www.youtube.com/iframe_api"></script>

<script src="./Engine/GameLoop.js" type="module"></script>
<script src="./Game.js" type="module"></script>
</html>
